services:
  codesense-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codesense-ai-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - ENVIRONMENT=production
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./sample_repo:/app/sample_repo
    networks:
      - codesense-network

networks:
  codesense-network:
    driver: bridge
